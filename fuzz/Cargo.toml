doc = false
bench = false

[[bin]]
name = "http_text"
path = "fuzz_targets/http_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_frame"
path = "fuzz_targets/ws_frame.rs"
test = false
doc = false
bench = false
