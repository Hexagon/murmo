[package]
name = "murmo-server"
description = "Murmo server: a rootcard home and a blind mailbox for end-to-end encrypted messages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rootcard = { version = "=0.3.5", default-features = false, features = ["vault"] }
rootcard-host = "=0.3.5"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.43", features = ["bundled"] }
getrandom = "0.4"
zeroize = "1.9"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"

[dev-dependencies]
ed25519-dalek = "3"
